                huntingGrounds: { type: string }
                notes: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }

  # ------------------------------------------------------------ clocks
  /clocks:
    get:
      operationId: listClocks
      responses:
        "200":
          description: all standalone clocks (campaign-, character-, and crew-owned)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./schemas/campaign.json#/$defs/clockSummary" }
    post:
      operationId: createClock
      x-snapshot: false
      description: >
        Create a standalone clock with total ownership metadata (clock-taxonomy
        §5). Ownership validation: ownerKind "campaign" ⇒ ownerId ""; ownerKind
        "character"/"crew" ⇒ ownerId must be the UUID of an existing entity of
        that kind (else VALIDATION). purpose must be in the game-setting
        ClockPurposes list (the schema enum is the canonical set; custom is
        always available). relatedClockIds (optional, default []): unique,
        never this clock's own id, every entry an existing standalone clock at
        write time (healing clocks are not referenceable); cycles allowed.
        behavior "bounded" ⇒ rollover stays 0; segments never exceed size.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ownerKind, ownerId, purpose, behavior, size]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                ownerKind: { enum: [campaign, character, crew] }
                ownerId: { type: string, description: "empty string for campaign ownership; otherwise the UUID of an existing entity of ownerKind" }
                purpose:
                  enum: [progress, danger, racing, linked, mission, tug-of-war, long-term-project, faction, score, custom]
                  description: "narrative purpose, from the game-setting ClockPurposes list; descriptive only, never auto-resolved"
                behavior: { enum: [bounded, rollover] }
                size: { type: integer, minimum: 1 }
                relatedClockIds:
                  type: array
                  items: { $ref: "./schemas/common.json#/$defs/uuid" }
                  uniqueItems: true
                  description: "optional, default []; standalone clock ids for descriptive linked/racing relationships"
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
  /clocks/{id}:
    get:
      operationId: getClock
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: clock DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clock" }
        "404": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
  /clocks/{id}/update:
    post:
      operationId: updateClock
      x-snapshot: true
      description: >
        Partial ownership/purpose/relationship update (clock-taxonomy §5 rules
        3 and 5). ownerKind and ownerId are updated together — provide both or
        neither, else VALIDATION. Ownership validation: ownerKind "campaign" ⇒
        ownerId ""; ownerKind "character"/"crew" ⇒ ownerId must be the UUID of
        an existing entity of that kind. purpose must be in the game-setting
        ClockPurposes list. relatedClockIds: unique, never this clock's own id,
        every entry an existing standalone clock at write time; cycles allowed.
        Other mechanical fields (name, behavior, size, segments, rollover) are
        not editable here — they change through the dedicated ops. Degraded
        clock → 422 INVALID_ENTITY.
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatch" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                ownerKind: { enum: [campaign, character, crew] }
                ownerId: { type: string, description: "empty string for campaign ownership; otherwise the UUID of an existing entity of ownerKind; must accompany ownerKind" }
                purpose:
                  enum: [progress, danger, racing, linked, mission, tug-of-war, long-term-project, faction, score, custom]
                  description: "narrative purpose, from the game-setting ClockPurposes list; descriptive only, never auto-resolved"
                relatedClockIds:
                  type: array
                  items: { $ref: "./schemas/common.json#/$defs/uuid" }
                  uniqueItems: true
                  description: "replaces the full relationship set; descriptive linked/racing relationships"
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
  /clocks/{id}/delete:
    post:
      operationId: deleteClock
      x-snapshot: false
      description: >
        Requires confirm:true (CONFIRM_REQUIRED otherwise). If-Match required
        (entity revision, or the sha256: content token for a degraded clock).
        Unlink-on-delete (W4): this clock's id is removed from every remaining
        clock's relatedClockIds in the same atomic snapshot — no dangling
        references in readable state; related clocks themselves are never
        deleted, only unlinked.
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatchRequired" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Confirm" }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }
  /clocks/{id}/ops/clock.progress:
    post:
      operationId: clockProgress
      x-snapshot: false
      description: >
        Signed progress delta; clock-progress family: applied.requested is the
        requested progress, applied.effective all accepted progress including
        rollover, applied.visibleApplied and applied.overflowAdded report the
        split when nonzero (Q23). Positive delta fills visible segments and
        ADDS overflow to the existing rollover — overflow accumulates across
        progress calls and may exceed one clock size (Q24); bounded clocks
        clamp at full and discard overflow. Negative delta (tug-of-war
        emptying) consumes carried rollover FIRST, then empties visible
        segments, never below 0 (W6). Invariant maintained: rollover > 0 ⇒
        segments = size. Degraded clock → 422 INVALID_ENTITY.
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatch" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segments]
              additionalProperties: false
              properties:
                segments: { type: integer, description: "signed progress delta; negative empties (tug-of-war)" }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
  /clocks/{id}/ops/clock.reset:
    post:
      operationId: clockReset
      x-snapshot: false
      description: >
        Resets visible segments. Rollover clocks: applies AT MOST ONE clock
        size of carried overflow and retains the remaining overflow —
        segments' = min(rollover, size), rollover' = rollover − segments'
        (Q24; matches the reference RolloverClock.Reset). Bounded clocks:
        segments → 0 (rollover is always 0). Reset reports no applied numeric
        fields (clear/reset family: amount cleared is not reported). Degraded
        clock → 422 INVALID_ENTITY.
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatch" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
