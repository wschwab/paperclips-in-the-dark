  # ------------------------------------------------------------ crews
  /crews:
    get:
      operationId: listCrews
      responses:
        "200":
          description: crew summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./schemas/campaign.json#/$defs/crewSummary" }
    post:
      operationId: createCrew
      x-snapshot: false
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameStem, crewType]
              additionalProperties: false
              properties:
                gameStem: { type: string, pattern: "^[A-Za-z0-9-]+$" }
                crewType: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
  /crews/{id}:
    get:
      operationId: getCrew
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/download" }
      responses:
        "200":
          description: crew DTO (byte-identical to disk)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crew" }
        "404": { $ref: "#/components/responses/OpResult" }
  /crews/{id}/capabilities:
    get:
      operationId: getCrewCapabilities
      description: >
        Advisory crew capability projection: the full available upgrade
        catalog with total/marked/remaining boxes, the full available ability
        catalog with max/taken/remaining takes, effective turf, and the rep
        develop threshold. Never persisted in the entity DTO; mutations remain
        authoritative (UPGRADE_MAXED / ABILITY_MAXED).
      parameters:
        - { $ref: "#/components/parameters/id" }
      responses:
        "200":
          description: crew capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewCapabilities" }
        "404": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
  /crews/{id}/delete:
    post:
      operationId: deleteCrew
      x-snapshot: false
      description: >
        Requires confirm:true (CONFIRM_REQUIRED otherwise). Removes the entity
        and its history; not undoable. Works on entities in ANY state including
        degraded (If-Match: entity revision, or the sha256: content token for a
        degraded entity). Unlinks member characters: every readable character
        with dossier.crewId = this crew gets crewId cleared, atomically in the
        same snapshot (reported in sideEffects). Owner-deletion reassignment
        (W5): standalone clocks owned by this crew are reassigned to campaign
        ownership (ownerKind "campaign", ownerId "") in the same atomic
        snapshot, each with a new revision and updatedAt; no clock is ever
        deleted as a side effect. The result reports the reassigned clock ids as
        sideEffects entries "clock <id> reassigned to campaign" (the
        reassignedClockIds set).
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatchRequired" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Confirm" }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }
  /crews/{id}/import:
    post:
      operationId: importCrew
      x-snapshot: true
      description: >
        Import preview/apply for a full or PARTIAL document; ?preview=1 selects
        preview mode. Preview never writes: canonical document → 200 with the
        preview and a preview token; normalization needed (fills, conversions,
        clamps, legacy conversions, displayed removals) → 409
        NORMALIZATION_REQUIRED with warnings, the previewed document, and the
        preview token; needs-input pointers → 409 listing the exact pointers
        awaiting caller values. Apply (no preview param) requires If-Match
        (entity revision; degraded target: sha256: content token; missing →
        400 VALIDATION), the preview token, and confirm:true (missing →
        CONFIRM_REQUIRED); it atomically writes the previewed result, clears
        history, and takes exactly one baseline snapshot. Apply without values
        for needs-input pointers → 400 INVALID_ENTRY with pointer-level
        details; unknown properties are rejected unless the preview classifies
        and displays their removal; a changed document or stored entity since
        preview → 409 STALE_REVISION. If-Match is apply-only: preview mode
        never requires it.
        1 MiB payload cap → 413 PAYLOAD_TOO_LARGE.
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatch" }, { $ref: "#/components/parameters/idempotencyKey" }, { $ref: "#/components/parameters/preview" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: >
            Preview mode: PreviewResult (document already canonical; previewToken
            unlocks the confirming apply). Apply mode: the uniform OperationResult
            with the crew DTO and one baseline snapshot.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PreviewResult" }
                  - { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }
        "413": { $ref: "#/components/responses/OpResult" }
  /crews/{id}/repair-preview:
    post:
      operationId: repairCrewPreview
      x-snapshot: false
      description: >
        Repair preview for a degraded/repairable stored crew: computes the
        normalized result and warnings WITHOUT writing. Optional body:
        caller-supplied values for needs-input pointers, keyed by JSON pointer
        into the stored document (e.g. {"/name": "..."}); keys that do not
        resolve to a needs-input pointer are ignored with a warning. Stored
        entity already canonical → 200 PreviewResult with no token (nothing to
        confirm). Repairable → 409 NORMALIZATION_REQUIRED with warnings, the
        previewed result, and the preview token; needs-input pointers still
        awaiting caller values are listed in the preview. Unparseable stored
        bytes → 422 INVALID_ENTITY (cannot be repaired; deletion only).
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatch" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: "Optional caller-supplied values for needs-input pointers, keyed by JSON pointer."
      responses:
        "200":
          description: PreviewResult — stored entity is already canonical; nothing to repair.
          content:
            application/json:
