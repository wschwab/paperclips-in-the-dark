openapi: 3.1.0
info:
  title: Paperclips in the Dark API
  version: 1.0.0
  license: { name: MIT, identifier: MIT }
  description: >
    Agent-first campaign sheet manager for Blades in the Dark. Sheet manager,
    not rules engine: structural constraints only. All mutations are POST with
    JSON bodies and return the uniform OperationResult with the FULL entity DTO.
    All numeric maxima come from game-settings JSON, never hardcoded.
    Mutations accept optional If-Match (revision; REQUIRED on destructive
    operations — undo, delete, import-apply, repair-apply) and Idempotency-Key
    headers. Snapshot-worthiness of each mutation is declared via x-snapshot.
servers:
  - url: http://localhost:9657/api

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9-]+$" }
    ifMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Entity revision for readable entities, or the raw-byte content token
        (sha256:<lowercase hex>, the collection row's deleteToken) for degraded
        entities. Mismatch against the current stored state → 409
        STALE_REVISION. Required on undo, delete, import-apply, and repair-apply
        (see ifMatchRequired).
      schema: { $ref: "#/components/schemas/IfMatchValue" }
    ifMatchRequired:
      name: If-Match
      in: header
      required: true
      description: >
        Entity revision for readable entities, or the raw-byte content token
        (sha256:<lowercase hex>, the collection row's deleteToken) for degraded
        entities. Mismatch against the current stored state → 409
        STALE_REVISION.
      schema: { $ref: "#/components/schemas/IfMatchValue" }
    preview:
      name: preview
      in: query
      required: false
      description: "preview=1 selects preview mode: classify the submitted document and return the normalization preview + preview token; never writes."
      schema: { enum: ["1"] }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    download:
      name: download
      in: query
      required: false
      description: "download=1 adds Content-Disposition (export)."
      schema: { enum: ["1"] }
  schemas:
    Character: { $ref: "./schemas/character.json" }
    Crew: { $ref: "./schemas/crew.json" }
    Clock: { $ref: "./schemas/clock.json" }
    OperationResult: { $ref: "./schemas/operation-result.json" }
    OperationError: { $ref: "./schemas/operation-result.json#/$defs/operationError" }
    Delta:
      type: object
      required: [delta]
      additionalProperties: false
      properties:
        delta: { type: integer }
    Named:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
    Confirm:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm: { const: true }
    IfMatchValue:
      oneOf:
        - type: integer
          description: entity revision of a readable entity
        - { $ref: "./schemas/common.json#/$defs/errorContentToken" }
      description: "If-Match header value: integer revision, or sha256:<lowercase hex> content token for degraded entities."
    PreviewResult: { $ref: "./schemas/operation-result.json#/$defs/previewResult" }
    ImportRequest:
      type: object
      required: [entity]
      additionalProperties: false
      properties:
        entity:
          type: object
          description: >
            Full or partial entity document. The preview classifies every fill,
            conversion, correction, and data-dropping action; unknown properties
            are rejected unless the preview explicitly classifies and displays
            their removal (no silent data loss).
        previewToken:
          type: string
          minLength: 1
          description: >
            Apply mode: required. Issued by the preview (error details
            previewToken / token). Binds the submitted document and the
            previewed result; a changed document or stored entity since preview
            → 409 STALE_REVISION.
        confirm:
          const: true
          description: "Apply mode: required; missing → CONFIRM_REQUIRED."
      description: >
        preview=1 sends {entity} only (previewToken/confirm present in preview
        mode → 400 VALIDATION). Apply (no preview param) sends
        {entity, previewToken, confirm: true}. If-Match is apply-only like
        previewToken/confirm: preview mode does not require it; the confirming
        apply requires the header (missing → 400 VALIDATION).
    RepairApply:
      type: object
      required: [previewToken]
      additionalProperties: false
      properties:
        previewToken:
          type: string
          minLength: 1
          description: "Issued by repair-preview; binds the stored bytes and the previewed result. Changed bytes since preview → 409 STALE_REVISION."
        confirm:
          const: true
          description: "Required; missing → CONFIRM_REQUIRED."
    ServiceCapabilities:
      type: object
      required: [maxPayloadBytes, maxHistorySnapshots, maxBatchOperations]
      additionalProperties: false
      description: >
        Advisory service limits for presentation (governing spec, "Limits and
        capabilities"). Mutations remain authoritative: exceeding a limit
        fails with the documented typed error (import → 413 PAYLOAD_TOO_LARGE;
        batch with more ops → 400 VALIDATION). Values are fixed by the current
        server build.
      properties:
        maxPayloadBytes:
          type: integer
          const: 1048576
          description: "Maximum request/import payload size in bytes (1 MiB); beyond → 413 PAYLOAD_TOO_LARGE."
        maxHistorySnapshots:
          type: integer
          const: 50
          description: "History snapshots retained per entity; the oldest is pruned beyond this and undo still works."
        maxBatchOperations:
          type: integer
          const: 50
          description: "Maximum operations per /campaign/batch request (bounds are 1..50)."
    CharacterCapabilities:
      type: object
      required: [characterId, effectiveActionCaps, harmCapacities, loadLimits, availableAbilityTakes]
      additionalProperties: false
      description: >
        Advisory character projection for presentation (governing spec,
        "Limits and capabilities"). Derived limits are never persisted in the
        entity DTO. Mutations remain authoritative: action.set-rating and
        attribute.levelup enforce the effective cap (RATING_MAXED), harm.add
        reports slot-full spillover per level, gear.commit returns OVER_BULK,
        and ability.take returns ABILITY_MAXED when the state changed since
        this projection was read.
      properties:
        characterId:
          type: string
          pattern: "^[A-Za-z0-9-]+$"
        effectiveActionCaps:
          type: array
          description: "Effective rating cap per action: min(maxRating, crew-Mastery-derived cap)."
          items:
            type: object
            required: [action, maxRating, effectiveMax, masteryTotalBoxes, masteryMarkedBoxes]
            additionalProperties: false
            properties:
              action:
                type: string
                description: "Action name from the game settings Attributes[].Actions[]."
              maxRating:
                type: integer
                description: "Raw maximum from settings ActionPointMaximum (entity maxRating)."
              effectiveMax:
                type: integer
                description: "The enforced cap: min(maxRating, crew-derived cap)."
              masteryTotalBoxes:
                type: integer
                description: "Mastery upgrade TotalBoxes from the crew catalog (0 when the character has no crew or the crew type has no Mastery upgrade)."
              masteryMarkedBoxes:
                type: integer
                description: "Boxes marked on Mastery for the character's crew (0 when no crew); effectiveMax = ActionCap.Mastery only when marked ≥ total."
        harmCapacities:
          type: array
          description: "Harm slots per level with the current empty-slot count."
          items:
            type: object
            required: [level, capacity, remaining]
            additionalProperties: false
            properties:
              level:
                type: string
                enum: [lesser, moderate, severe, fatal]
              capacity:
                type: integer
                description: "Slots from settings HarmCapacities (2/2/1/1 for both supported games)."
              remaining:
                type: integer
                description: "Empty slots = capacity − filled; 0 → harm.add reports the spillover ladder."
        loadLimits:
          type: array
          description: "Maximum committed bulk per load commitment option."
          items:
            type: object
            required: [commitment, maxBulk, remainingBulk]
            additionalProperties: false
            properties:
              commitment:
                type: string
                enum: [none, light, normal, heavy, encumbered]
              maxBulk:
                type: integer
                description: "LoadMaxima.CommitmentMaxBulk for the option; LoadMaxima.MaxBulk for none."
              remainingBulk:
                type: integer
                description: "maxBulk − currently committed bulk (abilities such as Mule can raise the limit)."
        availableAbilityTakes:
          type: array
          description: "Remaining takes per playbook special ability."
          items:
            type: object
            required: [name, timesTaken, maxTakes, remaining]
            additionalProperties: false
            properties:
              name:
                type: string
                description: "Ability name from the playbook settings SpecialAbilities[]."
              timesTaken:
                type: integer
                minimum: 1
                description: "Takes recorded on the character DTO."
              maxTakes:
                type: integer
                description: "TimesTakeable from the playbook settings."
              remaining:
                type: integer
                description: "maxTakes − timesTaken; 0 → ability.take returns ABILITY_MAXED."
    CrewCapabilities:
      type: object
      required: [crewId, upgrades, abilities, effectiveTurf, developThreshold]
      additionalProperties: false
      description: >
        Advisory crew projection for presentation (governing spec, "Limits and
        capabilities"). Derived limits are never persisted in the entity DTO.
        Mutations remain authoritative: upgrade.mark returns UPGRADE_MAXED past
        totalBoxes and ability.take returns ABILITY_MAXED past maxTakes when
        the state changed since this projection was read.
      properties:
        crewId:
          type: string
          pattern: "^[A-Za-z0-9-]+$"
        upgrades:
          type: array
          description: "Full upgrade catalog of the crew type with current box state."
          items:
            type: object
            required: [name, totalBoxes, marked, remaining]
            additionalProperties: false
            properties:
              name:
                type: string
                description: "Upgrade name from the crew-settings catalog."
              totalBoxes:
                type: integer
                description: "TotalBoxes from the crew-settings catalog."
              marked:
                type: integer
                description: "Boxes currently marked on this crew (DTO upgrades[].boxesMarked)."
              remaining:
                type: integer
                description: "totalBoxes − marked; 0 → upgrade.mark returns UPGRADE_MAXED."
        abilities:
          type: array
          description: "Full special-ability catalog of the crew type with current take state."
          items:
            type: object
            required: [name, maxTakes, taken, remaining]
            additionalProperties: false
            properties:
              name:
                type: string
                description: "Ability name from the crew-settings catalog."
              maxTakes:
                type: integer
                description: "TimesTakeable from the crew-settings catalog."
              taken:
                type: integer
                description: "Times taken by this crew (DTO specialAbilities[].timesTaken)."
              remaining:
                type: integer
                description: "maxTakes − taken; 0 → ability.take returns ABILITY_MAXED."
        effectiveTurf:
          type: integer
          description: "Base turf + sum of claimed turf-delta effects from the claims map; S&V ships have no claims map, so this equals base turf."
        developThreshold:
          type: integer
          description: "max(0, rep.max − effectiveTurf); the tier-up rep threshold (rep needs to reach this before tier.add)."
  responses:
    OpResult:
      description: >
        Uniform operation result, used for successes and typed failures alike.
        On failure (ok:false) the error member is the whole-error discriminated
        union (operation-result.json $defs/operationError; also exposed as
        components.schemas.OperationError): one branch per errorCode,
        discriminated on code. Every branch declares its HTTP status, typed
        details shape, recovery instruction, retryable flag (the operation may
        succeed after the documented recovery action — never blind replay), and
        whether an entity, preview, or token accompanies the error. Top-level
        and batch[].error share the same union schema.

        Locked status table (spec-change-work-spec, stored-entity
        classification): VALIDATION 400, INVALID_ENTRY 400, INVALID_ENTITY 422,
        NORMALIZATION_REQUIRED 409, NOT_FOUND 404, STALE_REVISION 409,
        PAYLOAD_TOO_LARGE 413. All remaining codes (CONFIRM_REQUIRED, DUPLICATE,
        SLOT_FULL_FATAL, CANNOT_HEAL, ARMOR_NOT_AVAILABLE, ABILITY_MAXED,
        CANNOT_LEVEL_UP, RATING_MAXED, UPGRADE_MAXED, INSUFFICIENT_FUNDS,
        SATCHEL_FULL, OVER_BULK, NO_COMMITMENT, COMMITMENT_LOCKED, NO_HISTORY,
        GAME_NOT_FOUND, RETIRED, TRAUMA_REQUIRED, OUT_OF_ACTION) are domain
        failures delivered with HTTP 200 and the typed error body. Collections
        remain 200 even when members are degraded.

        Entity-targeted operation results additionally carry the optional
        derived canUndo (boolean) and historyCount (integer, minimum 0)
        top-level fields (operation-result.json) — never stored, computed at
        response time from the entity's retained snapshot count (retention cap
        50); canUndo = historyCount > 0. Batch items and pure failures do not
        carry them. GET entity detail stays raw (byte identity); roster
        summaries and operation results carry the derived fields
        (lifecycle-matrix §9).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OperationResult" }

paths:
  /health:
    get:
      operationId: health
      summary: Health + agent-skill discovery
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "./schemas/campaign.json#/$defs/health" }

  # ------------------------------------------------------------ capabilities
  # Advisory projections (governing spec "Limits and capabilities"): the
  # mutation endpoints remain authoritative and return typed stale/maxed
  # failures if state changes between projection and mutation.
  /capabilities:
    get:
      operationId: getServiceCapabilities
      description: >
        Service-level capabilities: payload, history, and batch limits.
        Advisory for presentation; mutations remain authoritative.
      responses:
        "200":
          description: service capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCapabilities" }

  /campaign:
    get:
      operationId: getCampaign
      responses:
        "200":
          description: campaign metadata
          content:
            application/json:
              schema: { $ref: "./schemas/campaign.json#/$defs/campaign" }
  /campaign/roster:
    get:
      operationId: getRoster
      responses:
        "200":
          description: all character + crew summaries
          content:
            application/json:
              schema: { $ref: "./schemas/campaign.json#/$defs/roster" }
  /campaign/crew/{crewId}/members:
    get:
      operationId: getCrewMembers
      parameters:
        - { name: crewId, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]+$" } }
      responses:
        "200":
          description: characters linked to this crew
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./schemas/campaign.json#/$defs/characterSummary" }
        "404": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
  /campaign/batch:
    post:
      operationId: batch
      summary: Sequential all-or-nothing multi-op; single snapshot + history entry
      x-snapshot: true
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              additionalProperties: false
              properties:
                ops:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [entity, id, op, args]
                    additionalProperties: false
                    properties:
                      entity: { enum: [character, crew, clock] }
                      id: { type: string }
                      op: { type: string, description: "dotted op name, e.g. stress.add" }
                      args: { type: object }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }

  /games:
    get:
      operationId: listGames
      responses:
        "200":
          description: installed games
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, stem, language]
                  properties:
                    name: { type: string }
                    stem: { type: string }
                    language: { type: string }
  /games/{stem}:
    get:
      operationId: getGame
      parameters:
        - { name: stem, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]+$" } }
      responses:
        "200":
          description: full game-settings JSON (authored data, served verbatim from data/games/)
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/OpResult" }
  /games/{stem}/playbooks:
    get:
      operationId: listPlaybooks
      parameters:
        - { name: stem, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]+$" } }
      responses:
        "200":
          description: playbook name + hook list
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/OpResult" }
  /games/{stem}/playbooks/{playbook}:
    get:
      operationId: getPlaybook
      parameters:
        - { name: stem, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]+$" } }
        - { name: playbook, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: full playbook settings
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/OpResult" }
  /games/{stem}/heritages:
    get:
      operationId: listHeritages
      parameters:
        - { name: stem, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]+$" } }
      responses:
        "200":
          description: heritage list
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/OpResult" }
  /games/{stem}/crews:
    get:
      operationId: getCrewSettings
      parameters:
        - { name: stem, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]+$" } }
      responses:
        "200":
          description: crew game settings
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/OpResult" }
  /games/{stem}/crews/{crewType}:
    get:
      operationId: getCrewTypeSettings
      parameters:
        - { name: stem, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]+$" } }
        - { name: crewType, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: full crew type settings
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/OpResult" }

  # ------------------------------------------------------------ characters
  /characters:
    get:
      operationId: listCharacters
      responses:
        "200":
          description: character summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./schemas/campaign.json#/$defs/characterSummary" }
    post:
      operationId: createCharacter
      x-snapshot: false
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameStem, playbook]
              additionalProperties: false
              properties:
                gameStem: { type: string, pattern: "^[A-Za-z0-9-]+$" }
                playbook: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
  /characters/pc:
    post:
      operationId: createPcCharacter
      x-snapshot: false
      description: >
        Dedicated PC creation path WITH server-side Talent validation
        (CONTRACT-01 / DEC-01 human ruling 2026-08-24). The unvalidated
        sibling createCharacter stays unchanged for experienced characters
        and NPCs; stored characters are never retroactively validated.
        Validation is settings-derived only (never constants): sum of
        actionRatings must equal the game's StartingActionDots exactly, every
        rating must be <= the game's StartingActionDotMax, and playbook must
        exist in the game's Playbooks. actionRatings property names must
        exactly match every action name published by the game's Attributes,
        except that actions carrying the chosen playbook's DefaultActionPoints
        may be omitted and take the default. Per-playbook DefaultActionPoints
        are enforced from settings (DEC-01 ruling; GameSettingExtensions
        reference): the final allocation = defaults ∪ submissions — a
        submitted value for a defaulted action must MATCH the default, a
        conflicting value => VALIDATION naming the action and the default;
        budget (StartingActionDots) and cap (StartingActionDotMax) checks run
        against the overlaid final map. Failure => VALIDATION (400) naming
        the violated rule and the numbers. A game whose settings omit
        StartingActionDots or StartingActionDotMax has not published a PC
        allocation budget: NOT_FOUND (404) naming the absent keys. Unknown
        game stem keeps the shared create semantics: GAME_NOT_FOUND as a
        200-status domain failure (SC-A3).
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameStem, playbook, actionRatings]
              additionalProperties: false
              properties:
                gameStem: { type: string, pattern: "^[A-Za-z0-9-]+$" }
                playbook: { type: string, minLength: 1 }
                actionRatings:
                  type: object
                  description: >
                    Map of every action name from the game's Attributes to its
                    starting rating. Property names are enforced server-side
                    to match the published action set (actions with a
                    playbook DefaultActionPoints default may be omitted);
                    each value is an integer clamped by settings to
                    0..StartingActionDotMax (the per-game maximum cannot be
                    static here — it is enforced from game settings, spec
                    §5.5), submitted values for defaulted actions must equal
                    the default, and the overlaid values' sum must equal
                    StartingActionDots.
                  additionalProperties:
                    type: integer
                    minimum: 0
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
  /characters/{id}:
    get:
      operationId: getCharacter
      summary: Full DTO; byte-identical to current.json on disk. ?download=1 = export.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/download" }
      responses:
        "200":
          description: character DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "404": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
  /characters/{id}/capabilities:
    get:
      operationId: getCharacterCapabilities
      description: >
        Advisory character capability projection: effective action caps with
        Mastery derivation inputs, harm capacities per level with remaining
        slots, load limits per commitment option, and remaining ability takes.
        Never persisted in the entity DTO; mutations remain authoritative
        (RATING_MAXED / slot-full spillover / OVER_BULK / ABILITY_MAXED).
      parameters:
        - { $ref: "#/components/parameters/id" }
      responses:
        "200":
          description: character capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterCapabilities" }
        "404": { $ref: "#/components/responses/OpResult" }
        "422": { $ref: "#/components/responses/OpResult" }
  /characters/{id}/delete:
    post:
      operationId: deleteCharacter
      x-snapshot: false
      description: >
        Requires confirm:true (CONFIRM_REQUIRED otherwise). Removes the entity
        and its history; not undoable. Works on entities in ANY state including
        degraded (If-Match: entity revision, or the sha256: content token for a
        degraded entity — deletion is the designed path for unreadable rows).
        Owner-deletion reassignment (W5): standalone clocks owned by this
        character are reassigned to campaign ownership (ownerKind "campaign",
        ownerId "") in the same atomic snapshot, each with a new revision and
        updatedAt; no clock is ever deleted as a side effect. The result reports
        the reassigned clock ids as sideEffects entries "clock <id> reassigned
        to campaign" (the reassignedClockIds set).
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifMatchRequired" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Confirm" }
      responses:
        "200": { $ref: "#/components/responses/OpResult" }
        "400": { $ref: "#/components/responses/OpResult" }
        "404": { $ref: "#/components/responses/OpResult" }
        "409": { $ref: "#/components/responses/OpResult" }
  /characters/{id}/import:
    post:
      operationId: importCharacter
      x-snapshot: true
      description: >
        Import preview/apply for a full or PARTIAL document; ?preview=1 selects
        preview mode. Preview never writes: canonical document → 200 with the
        preview and a preview token; normalization needed (fills, conversions,
        clamps, legacy conversions, displayed removals) → 409
        NORMALIZATION_REQUIRED with warnings, the previewed document, and the
        preview token; needs-input pointers → 409 listing the exact pointers
        awaiting caller values. Apply (no preview param) requires If-Match
        (entity revision; degraded target: sha256: content token; missing →
        400 VALIDATION), the preview token, and confirm:true (missing →
        CONFIRM_REQUIRED); it atomically writes the previewed result, clears
        history, and takes exactly one baseline snapshot. Apply without values
        for needs-input pointers → 400 INVALID_ENTRY with pointer-level
        details; unknown properties are rejected unless the preview classifies
        and displays their removal; a changed document or stored entity since
        preview → 409 STALE_REVISION. If-Match is apply-only: preview mode
        never requires it.
        Allowed on retired characters (data management, not gameplay). 1 MiB
        payload cap → 413 PAYLOAD_TOO_LARGE.
